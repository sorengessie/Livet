<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Begreppsträning</title><style>
*{box-sizing:border-box}body{margin:0;padding:18px;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eff6ff,#fff,#eef2ff);color:#0f172a}.wrap{max-width:760px;margin:auto}.card{margin-top:5vh;padding:clamp(24px,5vw,42px);background:#fff;border-radius:26px;box-shadow:0 20px 50px #4338ca22}.hidden{display:none!important}h1{font-size:clamp(34px,7vw,54px);margin:0 0 18px}button{min-height:48px;padding:0 20px;border:0;border-radius:14px;font-weight:800;font-size:16px}.home{position:fixed;top:12px;left:12px;z-index:20;background:#fff;border:1px solid #cbd5e1}.primary{width:100%;color:#fff;background:#4338ca}.choice{display:flex;justify-content:space-between;align-items:center;padding:18px;margin:24px 0;border:1px solid #cbd5e1;border-radius:16px}.switch{position:relative;width:62px;height:34px}.switch input{opacity:0}.slider{position:absolute;inset:0;background:#94a3b8;border-radius:99px}.slider:before{content:"";position:absolute;width:26px;height:26px;left:4px;top:4px;border-radius:50%;background:#fff;transition:.2s}.switch input:checked+.slider{background:#4338ca}.switch input:checked+.slider:before{transform:translateX(28px)}.top{display:flex;justify-content:space-between;font-weight:700;color:#475569}.barbg{height:9px;margin:9px 0 22px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar{height:100%;background:#4338ca}textarea{width:100%;min-height:140px;padding:15px;border:1px solid #cbd5e1;border-radius:15px;font:inherit}.actions{display:flex;gap:12px;margin-top:16px}.check{flex:1;color:#fff;background:#4338ca}.clear{background:#fff;border:1px solid #cbd5e1}.feedback{display:none;margin-top:16px;padding:15px;border-radius:14px}.feedback.show{display:block}.correct{background:#ecfdf5;color:#065f46}.partial{background:#fffbeb;color:#854d0e}.incorrect,.incomplete{background:#fff1f2;color:#9f1239}.peek{position:relative;display:inline-block;margin-top:16px}.peekbtn{color:#fff;background:#475569}.popup{position:absolute;left:0;bottom:calc(100% + 10px);z-index:10;width:max-content;max-width:min(560px,82vw);padding:14px;border-radius:12px;color:#fff;background:#0f172a;box-shadow:0 12px 28px #0004;opacity:0;visibility:hidden;transform:translateY(6px);transition:.15s;pointer-events:none}.peek.open .popup{opacity:1;visibility:visible;transform:none}.next{display:none;width:100%;margin-top:16px;color:#fff;background:#047857}.next.show{display:block}.finish{text-align:center}.trophy{font-size:var(--size);line-height:1}.small{--size:90px}.medium{--size:140px}.large{--size:200px}@media(max-width:520px){.actions{flex-direction:column}.home{position:static;margin-bottom:8px}}
</style></head><body><button id="homeTop" class="home">↶ Börja om</button><main class="wrap"><section id="start" class="card"><h1>Begreppsträning</h1><p>Träna på 38 begrepp.</p><div class="choice"><div><b>Slumpmässig ordning</b><div id="mode">Av: tabellens ordning</div></div><label class="switch"><input id="random" type="checkbox"><span class="slider"></span></label></div><button id="startBtn" class="primary">Starta</button></section><section id="quiz" class="hidden"><div class="top"><span id="counter"></span><span id="score"></span></div><div class="barbg"><div id="bar" class="bar"></div></div><div class="card" style="margin-top:0"><p>FÖRKLARA BEGREPPET</p><h1 id="term"></h1><textarea id="answer" placeholder="Skriv med egna ord..."></textarea><div class="actions"><button id="check" class="check">Bedöm svaret</button><button id="clear" class="clear">Rensa</button></div><div id="feedback" class="feedback"><h2 id="ft"></h2><p id="fm"></p></div><div id="peek" class="peek"><button id="peekBtn" class="peekbtn" aria-expanded="false">👀 Tjuvkika</button><div id="popup" class="popup"></div></div><button id="next" class="next">Nästa →</button></div></section><section id="finish" class="card finish hidden"><h1>Klart!</h1><div id="trophy" class="trophy">🏆</div><h2 id="award"></h2><p id="summary"></p><button id="again" class="primary">Träna igen</button></section></main><script>
const source=[{"term": "Biologi", "explanation": "Läran om livet.", "required": [["läran", "lära"], ["livet", "liv"]]}, {"term": "Organism", "explanation": "En levande varelse.", "required": [["levande"], ["varelse", "organism"]]}, {"term": "Cell", "explanation": "Den minsta levande enheten. Den har en egen ämnesomsättning och styrs av egna arvsanlag. Finns olika typer av celler ex. djurcell, växtcell, bakteriecell och svampcell.", "required": [["minsta"], ["levande"], ["enhet", "byggsten"]]}, {"term": "Kloroplast", "explanation": "Finns i vissa celler och innehåller klorofyll.", "required": [["cell"], ["klorofyll"]]}, {"term": "Klorofyll", "explanation": "Grönt färgämne som gör att växter kan använda ljusenergi.", "required": [["grönt", "grön"], ["färgämne", "pigment"], ["ljusenergi", "ljus"]]}, {"term": "Vakuol", "explanation": "Ett hålrum hos eukaryota celler som kan innehålla vatten, cellvätska och nedbruten föda.", "required": [["hålrum", "blåsa"], ["cell"], ["vatten", "cellvätska", "föda"]]}, {"term": "Cellmembran", "explanation": "Ett tunt skikt som kan släppa in och ut ämnen.", "required": [["tunt", "skikt", "hinna"], ["släppa", "släpper"], ["in"], ["ut"]]}, {"term": "Cellkärna", "explanation": "Den del i mitten av cellen där arvsmassan (DNA) finns.", "required": [["cell"], ["arvsmassa", "dna"]]}, {"term": "DNA", "explanation": "Är ett kemiskt ämne som innehåller den genetiska informationen (gener) eller arvsmassa. Finns i alla organismer.", "required": [["kemiskt", "ämne"], ["genetisk", "gener", "arvsmassa", "information"]]}, {"term": "Cellvätska", "explanation": "Är en vattenlösning som finns innanför cellmembranet och transporterar olika ämnen i cellen.", "required": [["vattenlösning", "vätska"], ["cellmembran", "cellen"], ["transport"]]}, {"term": "Cellvägg", "explanation": "Ett skyddande skal utanför cellmembranet hos vissa levande celler, t.ex. växtceller och svampceller.", "required": [["skyddande", "skydd"], ["skal", "vägg"], ["cellmembran", "cell"]]}, {"term": "Ribosom", "explanation": "Cellens proteinfabrik.", "required": [["protein"], ["fabrik", "tillverkar"]]}, {"term": "Mitokondrie", "explanation": "Del av cellen, det här är det mesta av energin från näringsämnen utvinns.", "required": [["cell"], ["energi"], ["näringsämnen", "näring"]]}, {"term": "Domän", "explanation": "Huvudgrupper. Allt levande delas in i tre domäner: bakterier, arkéer och eukaryoter.", "required": [["huvudgrupp"], ["bakterier"], ["arkéer", "arkeer"], ["eukaryoter"]]}, {"term": "Art", "explanation": "Organismer som kan fortplanta sig med varandra och som då kan få avkomma (barn) tillhör samma art.", "required": [["organismer"], ["fortplanta", "föröka", "para"], ["avkomma", "barn"]]}, {"term": "Hybrid", "explanation": "En korsning mellan två arter.", "required": [["korsning"], ["arter", "art"]]}, {"term": "Bakterie", "explanation": "Encellig organism som saknar cellkärna.", "required": [["encellig", "en cell"], ["saknar", "utan"], ["cellkärna"]]}, {"term": "Arkée", "explanation": "Encellig organism som saknar cellkärna.", "required": [["encellig", "en cell"], ["saknar", "utan"], ["cellkärna"]]}, {"term": "Eukaryot", "explanation": "Organismer med cellkärna, ex. växter, djur, svampar och alger.", "required": [["organism"], ["cellkärna"]]}, {"term": "Prokaryot", "explanation": "Organismer utan cellkärna.", "required": [["organism"], ["utan", "saknar"], ["cellkärna"]]}, {"term": "Evolution", "explanation": "Förändring (utveckling) av organismernas ärftliga egenskaper.", "required": [["förändring", "utveckling"], ["ärftliga", "arv"], ["egenskaper"]]}, {"term": "Naturligt urval", "explanation": "En biologisk process där yttre faktorer påverkar genetiskt olika individer i en population, dvs. att organismer med vissa egenskaper har större chans att överleva.", "required": [["yttre", "miljö"], ["egenskaper"], ["överleva", "överlevnad"], ["population", "individer"]]}, {"term": "Sexuellt urval", "explanation": "Egenskaper som gör att vissa organismer får para sig, få många ungar och föra sitt genetiska arv vidare.", "required": [["egenskaper"], ["para", "fortplanta"], ["ungar", "avkomma"], ["genetiska", "arv"]]}, {"term": "Konkurrens", "explanation": "Att tävla om något. I naturen handlar det om resurser som föda, vatten och skydd.", "required": [["tävla", "konkurrera"], ["resurser", "föda", "vatten", "skydd"]]}, {"term": "Anpassning", "explanation": "När organismer förändrar något till nya förhållanden eller en viss situation.", "required": [["organism"], ["förändrar", "anpassar"], ["förhållanden", "situation", "miljö"]]}, {"term": "Encellig organism", "explanation": "En organism som består av en cell, ex. bakterier.", "required": [["organism"], ["en", "enda"], ["cell"]]}, {"term": "Flercellig organism", "explanation": "En organism som består av flera celler.", "required": [["organism"], ["flera", "många"], ["celler", "cell"]]}, {"term": "Nedbrytare", "explanation": "Lever på döda delar från växter och djur.", "required": [["döda", "dött"], ["växter", "djur"], ["lever", "delar"]]}, {"term": "Parasit", "explanation": "En organism som tar sin näring från andra levande varelser.", "required": [["organism"], ["näring"], ["andra", "värd"], ["levande", "varelser"]]}, {"term": "Virus", "explanation": "Är kemiska partiklar som är mindre än bakterier. Virus består inte av celler och är inte levande.", "required": [["partiklar", "partikel"], ["mindre", "bakterier"], ["inte", "saknar"], ["celler", "levande"]]}, {"term": "Ryggradslösa djur", "explanation": "Djur utan ryggrad och skelett. Ex. svampdjur, rundmaskar, ringmaskar och leddjur.", "required": [["djur"], ["utan", "saknar"], ["ryggrad"], ["skelett"]]}, {"term": "Ryggradsdjur", "explanation": "Djur med ryggrad och skelett. Till gruppen tillhör: fiskar, groddjur, kräldjur, däggdjur och fåglar.", "required": [["djur"], ["ryggrad"], ["skelett"]]}, {"term": "Växelvarma djur", "explanation": "Kroppstemperaturen följer omgivningens temperatur.", "required": [["kroppstemperatur", "temperatur"], ["följer", "påverkas"], ["omgivning"]]}, {"term": "Jämnvarma djur", "explanation": "Fåglar och däggdjur är jämnvarma. De har en jämn kroppstemperatur som inte påverkas av omgivningen.", "required": [["jämn", "konstant"], ["kroppstemperatur", "temperatur"], ["inte", "opåverkad"], ["omgivning"]]}, {"term": "Inre befruktning", "explanation": "Spermier och äggceller smälter samman inuti honans kropp. Kräldjur, fåglar och däggdjur har inre befruktning.", "required": [["spermier"], ["äggceller", "ägg"], ["inuti", "inne i"], ["honans", "kropp"]]}, {"term": "Yttre befruktning", "explanation": "Spermier och äggceller träffas utanför honans kropp. Fiskar och groddjur har yttre befruktning.", "required": [["spermier"], ["äggceller", "ägg"], ["utanför"], ["honans", "kropp"]]}, {"term": "Fotosyntes", "explanation": "Växternas tillverkning av glukos och syre med hjälp av koldioxid, vatten och ljusenergi. Koldioxid + Vatten + Ljusenergi → Glukos + Syre.", "required": [["växter", "växternas"], ["glukos"], ["syre"], ["koldioxid"], ["vatten"], ["ljusenergi", "ljus"]]}, {"term": "Cellandning", "explanation": "Cellernas förbränning av glukos med hjälp av syre. Glukos + Syre → Koldioxid + vatten och ljusenergi.", "required": [["celler", "cellernas"], ["glukos"], ["syre"], ["koldioxid"], ["vatten"], ["energi", "ljusenergi"]]}];let qs=[],i=0,correct=0,first=0,passed=false,tried=false;const $=x=>document.getElementById(x);function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim()}function shuffle(a){for(let x=a.length-1;x;x--){let y=Math.floor(Math.random()*(x+1));[a[x],a[y]]=[a[y],a[x]]}}function assess(a,q){a=norm(a);if(a.length<3)return['incomplete','Utveckla svaret','Skriv lite mer.'];let miss=q.required.filter(g=>!g.some(w=>a.includes(norm(w))));if(!miss.length)return['correct','Godkänt!','Alla nödvändiga delar finns med.'];let m=q.required.length-miss.length;return m?['partial','Delvis korrekt',`Du har med ${m} av ${q.required.length} nödvändiga delar.`]:['incorrect','Inte tillräckligt','Nödvändiga delar saknas.']}function sound(){let C=window.AudioContext||window.webkitAudioContext;if(!C)return;let c=new C();[523,659,784,1047].forEach((f,n)=>{let o=c.createOscillator(),g=c.createGain(),t=c.currentTime+n*.1;o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.16,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.23)});setTimeout(()=>c.close(),900)}function hide(){$('feedback').className='feedback';$('next').classList.remove('show')}function render(){passed=tried=false;let q=qs[i];$('term').textContent=q.term;$('popup').textContent=q.explanation;$('counter').textContent=`Begrepp ${i+1} av ${qs.length}`;$('score').textContent=`${correct} godkända`;$('bar').style.width=`${i/qs.length*100}%`;$('answer').value='';setPeek(false);hide()}function check(){let r=assess($('answer').value,qs[i]);$('feedback').className=`feedback show ${r[0]}`;$('ft').textContent=r[1];$('fm').textContent=r[2];if(r[0]==='correct'){if(!passed){correct++;passed=true;if(!tried)first++;sound()}$('next').classList.add('show')}else tried=true;$('score').textContent=`${correct} godkända`}function goHome(){qs=[];i=correct=first=0;$('quiz').classList.add('hidden');$('finish').classList.add('hidden');$('start').classList.remove('hidden')}function done(){let p=Math.round(first/qs.length*100),s=p>=80?'large':p>=50?'medium':'small';$('trophy').className=`trophy ${s}`;$('award').textContent=p>=80?'Guldpokal':p>=50?'Silverpokal':'Bronspokal';$('summary').textContent=`Rätt på första försöket: ${first} av ${qs.length} (${p} %).`;$('quiz').classList.add('hidden');$('finish').classList.remove('hidden')}
$('random').onchange=e=>$('mode').textContent=e.target.checked?'På: slumpmässig ordning':'Av: tabellens ordning';$('startBtn').onclick=()=>{qs=source.map(x=>({...x}));if($('random').checked)shuffle(qs);i=correct=first=0;$('start').classList.add('hidden');$('quiz').classList.remove('hidden');render()};$('check').onclick=check;$('clear').onclick=()=>{$('answer').value='';hide()};$('answer').oninput=hide;$('next').onclick=()=>{if(++i>=qs.length)done();else render()};function setPeek(open){
  $('peek').classList.toggle('open',open);
  $('peekBtn').setAttribute('aria-expanded',String(open));
}
$('peekBtn').onclick=e=>{
  e.preventDefault();
  e.stopPropagation();
  const willOpen=!$('peek').classList.contains('open');
  setPeek(willOpen);
  if(!willOpen)$('peekBtn').blur();
};
if(window.matchMedia('(hover: hover) and (pointer: fine)').matches){
  $('peek').addEventListener('mouseenter',()=>setPeek(true));
  $('peek').addEventListener('mouseleave',()=>setPeek(false));
}
document.addEventListener('click',e=>{
  if(!$('peek').contains(e.target))setPeek(false);
});$('homeTop').onclick=goHome;$('again').onclick=()=>$('startBtn').click();
</script></body></html>
