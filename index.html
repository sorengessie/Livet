<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Begreppsträning</title><style>
:root{--p:#4338ca;--pd:#312e81;--ok:#047857;--bad:#be123c;--ink:#0f172a;--muted:#64748b;--line:#cbd5e1}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;font-family:Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#eff6ff,#fff 50%,#eef2ff)}button{min-height:48px;padding:0 20px;border:0;border-radius:14px;font:inherit;font-weight:800;cursor:pointer}.wrap{max-width:780px;margin:auto}.card{margin-top:5vh;padding:clamp(24px,5vw,42px);border-radius:26px;background:#fff;box-shadow:0 20px 50px #4338ca22}.hidden{display:none!important}h1{margin:0 0 16px;font-size:clamp(34px,7vw,54px)}.home{position:fixed;top:12px;left:12px;z-index:20;border:1px solid var(--line);background:#fff}.primary,.check{color:#fff;background:var(--p)}.primary{width:100%}.settings{display:grid;gap:18px;margin:24px 0}.setting{padding:18px;border:1px solid var(--line);border-radius:18px;background:#f8fafc}.setting h2{margin:0 0 12px;font-size:18px}.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mode-card{position:relative;display:block;padding:16px;border:2px solid var(--line);border-radius:15px;background:#fff;cursor:pointer}.mode-card input{position:absolute;opacity:0}.mode-card:has(input:checked){border-color:var(--p);background:#eef2ff}.mode-card strong,.mode-card small{display:block}.mode-card small{margin-top:5px;color:var(--muted);line-height:1.35}.switch-row{display:flex;justify-content:space-between;align-items:center;gap:20px}.switch{position:relative;width:62px;height:34px;flex:0 0 auto}.switch input{opacity:0}.slider{position:absolute;inset:0;border-radius:99px;background:#94a3b8}.slider:before{content:"";position:absolute;width:26px;height:26px;left:4px;top:4px;border-radius:50%;background:#fff;transition:.2s}.switch input:checked+.slider{background:var(--p)}.switch input:checked+.slider:before{transform:translateX(28px)}.top{display:flex;justify-content:space-between;font-weight:700;color:#475569}.barbg{height:9px;margin:9px 0 22px;border-radius:99px;overflow:hidden;background:#e2e8f0}.bar{height:100%;background:var(--p)}.eyebrow{margin:0;color:var(--p);font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.input-area textarea{width:100%;min-height:140px;padding:15px;border:1px solid var(--line);border-radius:15px;font:inherit;resize:vertical}.options{display:grid;gap:12px;padding:0;border:0}.options legend{margin-bottom:10px;font-weight:800}.option{display:flex;gap:12px;padding:15px;border:2px solid var(--line);border-radius:15px;background:#fff;cursor:pointer}.option.selected{border-color:var(--p);background:#eef2ff}.option.correct-choice{border-color:#10b981;background:#ecfdf5}.option.wrong-choice{border-color:#f43f5e;background:#fff1f2}.option input{margin-top:4px;transform:scale(1.25)}.actions{display:flex;gap:12px;margin-top:18px}.check{flex:1}.clear{border:1px solid var(--line);background:#fff}.feedback{display:none;margin-top:16px;padding:15px;border-radius:14px}.feedback.show{display:block}.feedback.good{color:#065f46;background:#ecfdf5}.feedback.partial{color:#854d0e;background:#fffbeb}.feedback.bad{color:#9f1239;background:#fff1f2}.peek{position:relative;display:inline-block;margin-top:16px}.peekbtn{color:#fff;background:#475569}.popup{position:absolute;left:0;bottom:calc(100% + 10px);z-index:10;width:max-content;max-width:min(560px,82vw);padding:14px;border-radius:12px;color:#fff;background:#0f172a;box-shadow:0 12px 28px #0004;opacity:0;visibility:hidden;transform:translateY(6px);transition:.15s;pointer-events:none}.peek.open .popup{opacity:1;visibility:visible;transform:none}.next{display:none;width:100%;margin-top:16px;color:#fff;background:var(--ok)}.next.show{display:block}.finish{text-align:center}.trophy{font-size:var(--size);line-height:1}.small{--size:90px}.medium{--size:140px}.large{--size:200px}@media(max-width:560px){.actions,.mode-grid{grid-template-columns:1fr;flex-direction:column}.home{position:static;margin-bottom:8px}}
</style></head><body><button id="homeTop" class="home">↶ Börja om</button><main class="wrap"><section id="start" class="card"><h1>Begreppsträning</h1><p>Välj hur du vill svara och i vilken ordning begreppen ska visas.</p><div class="settings"><div class="setting"><h2>Svarssätt</h2><div class="mode-grid"><label class="mode-card"><input type="radio" name="answerMode" value="write" checked><strong>✍️ Skriv svaret själv</strong><small>Skriv en egen förklaring. Nödvändiga nyckelord eller likvärdiga uttryck måste finnas med.</small></label><label class="mode-card"><input type="radio" name="answerMode" value="choice"><strong>☑️ Välj bland tre alternativ</strong><small>Markera en av tre förklaringar. Ett alternativ är korrekt.</small></label></div></div><div class="setting switch-row"><div><strong>Slumpmässig ordning</strong><div id="orderText">Av: tabellens ordning</div></div><label class="switch"><input id="random" type="checkbox"><span class="slider"></span></label></div></div><button id="startBtn" class="primary">Starta träningen</button></section><section id="quiz" class="hidden"><div class="top"><span id="counter"></span><span id="score"></span></div><div class="barbg"><div id="bar" class="bar"></div></div><div class="card" style="margin-top:0"><p id="questionType" class="eyebrow"></p><h1 id="term"></h1><div id="writeArea" class="input-area"><label for="answer"><strong>Din förklaring</strong></label><textarea id="answer" placeholder="Skriv med egna ord..."></textarea></div><fieldset id="options" class="options hidden"><legend>Markera ett alternativ</legend></fieldset><div class="actions"><button id="check" class="check">Bedöm svaret</button><button id="clear" class="clear">Rensa</button></div><div id="feedback" class="feedback"><h2 id="ft"></h2><p id="fm"></p></div><div id="peek" class="peek"><button id="peekBtn" class="peekbtn" aria-expanded="false">👀 Tjuvkika</button><div id="popup" class="popup"></div></div><button id="next" class="next">Nästa →</button></div></section><section id="finish" class="card finish hidden"><h1>Klart!</h1><div id="trophy" class="trophy">🏆</div><h2 id="award"></h2><p id="summary"></p><button id="again" class="primary">Träna igen</button></section></main><script>
const source=[{"term":"Biologi","explanation":"Läran om livet.","required":[["läran","lära"],["livet","liv"]],"wrong":["En levande varelse.","Organismer som kan fortplanta sig med varandra och som då kan få avkomma (barn) tillhör samma art."]},{"term":"Organism","explanation":"En levande varelse.","required":[["levande"],["varelse","organism"]],"wrong":["Organismer som kan fortplanta sig med varandra och som då kan få avkomma (barn) tillhör samma art.","En korsning mellan två arter."]},{"term":"Cell","explanation":"Den minsta levande enheten. Den har en egen ämnesomsättning och styrs av egna arvsanlag. Finns olika typer av celler ex. djurcell, växtcell, bakteriecell och svampcell.","required":[["minsta"],["levande"],["enhet","byggsten"]],"wrong":["Finns i vissa celler och innehåller klorofyll.","Grönt färgämne som gör att växter kan använda ljusenergi."]},{"term":"Kloroplast","explanation":"Finns i vissa celler och innehåller klorofyll.","required":[["cell"],["klorofyll"]],"wrong":["Grönt färgämne som gör att växter kan använda ljusenergi.","Ett hålrum hos eukaryota celler som kan innehålla vatten, cellvätska och nedbruten föda."]},{"term":"Klorofyll","explanation":"Grönt färgämne som gör att växter kan använda ljusenergi.","required":[["grönt","grön"],["färgämne","pigment"],["ljusenergi","ljus"]],"wrong":["Ett hålrum hos eukaryota celler som kan innehålla vatten, cellvätska och nedbruten föda.","Ett tunt skikt som kan släppa in och ut ämnen."]},{"term":"Vakuol","explanation":"Ett hålrum hos eukaryota celler som kan innehålla vatten, cellvätska och nedbruten föda.","required":[["hålrum","blåsa"],["cell"],["vatten","cellvätska","föda"]],"wrong":["Ett tunt skikt som kan släppa in och ut ämnen.","Den del i mitten av cellen där arvsmassan (DNA) finns."]},{"term":"Cellmembran","explanation":"Ett tunt skikt som kan släppa in och ut ämnen.","required":[["tunt","skikt","hinna"],["släppa","släpper"],["in"],["ut"]],"wrong":["Den del i mitten av cellen där arvsmassan (DNA) finns.","Är ett kemiskt ämne som innehåller den genetiska informationen (gener) eller arvsmassa. Finns i alla organismer."]},{"term":"Cellkärna","explanation":"Den del i mitten av cellen där arvsmassan (DNA) finns.","required":[["cell"],["arvsmassa","dna"]],"wrong":["Är ett kemiskt ämne som innehåller den genetiska informationen (gener) eller arvsmassa. Finns i alla organismer.","Är en vattenlösning som finns innanför cellmembranet och transporterar olika ämnen i cellen."]},{"term":"DNA","explanation":"Är ett kemiskt ämne som innehåller den genetiska informationen (gener) eller arvsmassa. Finns i alla organismer.","required":[["kemiskt","ämne"],["genetisk","gener","arvsmassa","information"]],"wrong":["Är en vattenlösning som finns innanför cellmembranet och transporterar olika ämnen i cellen.","Ett skyddande skal utanför cellmembranet hos vissa levande celler, t.ex. växtceller och svampceller."]},{"term":"Cellvätska","explanation":"Är en vattenlösning som finns innanför cellmembranet och transporterar olika ämnen i cellen.","required":[["vattenlösning","vätska"],["cellmembran","cellen"],["transport"]],"wrong":["Ett skyddande skal utanför cellmembranet hos vissa levande celler, t.ex. växtceller och svampceller.","Cellens proteinfabrik."]},{"term":"Cellvägg","explanation":"Ett skyddande skal utanför cellmembranet hos vissa levande celler, t.ex. växtceller och svampceller.","required":[["skyddande","skydd"],["skal","vägg"],["cellmembran","cell"]],"wrong":["Cellens proteinfabrik.","Del av cellen, det här är det mesta av energin från näringsämnen utvinns."]},{"term":"Ribosom","explanation":"Cellens proteinfabrik.","required":[["protein"],["fabrik","tillverkar"]],"wrong":["Del av cellen, det här är det mesta av energin från näringsämnen utvinns.","Encellig organism som saknar cellkärna."]},{"term":"Mitokondrie","explanation":"Del av cellen, det här är det mesta av energin från näringsämnen utvinns.","required":[["cell"],["energi"],["näringsämnen","näring"]],"wrong":["Encellig organism som saknar cellkärna.","Encellig organism som saknar cellkärna."]},{"term":"Domän","explanation":"Huvudgrupper. Allt levande delas in i tre domäner: bakterier, arkéer och eukaryoter.","required":[["huvudgrupp"],["bakterier"],["arkéer","arkeer"],["eukaryoter"]],"wrong":["Organismer som kan fortplanta sig med varandra och som då kan få avkomma (barn) tillhör samma art.","En korsning mellan två arter."]},{"term":"Art","explanation":"Organismer som kan fortplanta sig med varandra och som då kan få avkomma (barn) tillhör samma art.","required":[["organismer"],["fortplanta","föröka","para"],["avkomma","barn"]],"wrong":["En korsning mellan två arter.","Förändring (utveckling) av organismernas ärftliga egenskaper."]},{"term":"Hybrid","explanation":"En korsning mellan två arter.","required":[["korsning"],["arter","art"]],"wrong":["Förändring (utveckling) av organismernas ärftliga egenskaper.","En biologisk process där yttre faktorer påverkar genetiskt olika individer i en population, dvs. att organismer med vissa egenskaper har större chans att överleva."]},{"term":"Bakterie","explanation":"Encellig organism som saknar cellkärna.","required":[["encellig","en cell"],["saknar","utan"],["cellkärna"]],"wrong":["Encellig organism som saknar cellkärna.","Organismer med cellkärna, ex. växter, djur, svampar och alger."]},{"term":"Arkée","explanation":"Encellig organism som saknar cellkärna.","required":[["encellig","en cell"],["saknar","utan"],["cellkärna"]],"wrong":["Organismer med cellkärna, ex. växter, djur, svampar och alger.","Organismer utan cellkärna."]},{"term":"Eukaryot","explanation":"Organismer med cellkärna, ex. växter, djur, svampar och alger.","required":[["organism"],["cellkärna"]],"wrong":["Organismer utan cellkärna.","En organism som består av en cell, ex. bakterier."]},{"term":"Prokaryot","explanation":"Organismer utan cellkärna.","required":[["organism"],["utan","saknar"],["cellkärna"]],"wrong":["En organism som består av en cell, ex. bakterier.","En organism som består av flera celler."]},{"term":"Evolution","explanation":"Förändring (utveckling) av organismernas ärftliga egenskaper.","required":[["förändring","utveckling"],["ärftliga","arv"],["egenskaper"]],"wrong":["En biologisk process där yttre faktorer påverkar genetiskt olika individer i en population, dvs. att organismer med vissa egenskaper har större chans att överleva.","Egenskaper som gör att vissa organismer får para sig, få många ungar och föra sitt genetiska arv vidare."]},{"term":"Naturligt urval","explanation":"En biologisk process där yttre faktorer påverkar genetiskt olika individer i en population, dvs. att organismer med vissa egenskaper har större chans att överleva.","required":[["yttre","miljö"],["egenskaper"],["överleva","överlevnad"],["population","individer"]],"wrong":["Egenskaper som gör att vissa organismer får para sig, få många ungar och föra sitt genetiska arv vidare.","Att tävla om något. I naturen handlar det om resurser som föda, vatten och skydd."]},{"term":"Sexuellt urval","explanation":"Egenskaper som gör att vissa organismer får para sig, få många ungar och föra sitt genetiska arv vidare.","required":[["egenskaper"],["para","fortplanta"],["ungar","avkomma"],["genetiska","arv"]],"wrong":["Att tävla om något. I naturen handlar det om resurser som föda, vatten och skydd.","När organismer förändrar något till nya förhållanden eller en viss situation."]},{"term":"Konkurrens","explanation":"Att tävla om något. I naturen handlar det om resurser som föda, vatten och skydd.","required":[["tävla","konkurrera"],["resurser","föda","vatten","skydd"]],"wrong":["När organismer förändrar något till nya förhållanden eller en viss situation.","Huvudgrupper. Allt levande delas in i tre domäner: bakterier, arkéer och eukaryoter."]},{"term":"Anpassning","explanation":"När organismer förändrar något till nya förhållanden eller en viss situation.","required":[["organism"],["förändrar","anpassar"],["förhållanden","situation","miljö"]],"wrong":["Huvudgrupper. Allt levande delas in i tre domäner: bakterier, arkéer och eukaryoter.","Organismer som kan fortplanta sig med varandra och som då kan få avkomma (barn) tillhör samma art."]},{"term":"Encellig organism","explanation":"En organism som består av en cell, ex. bakterier.","required":[["organism"],["en","enda"],["cell"]],"wrong":["En organism som består av flera celler.","Den minsta levande enheten. Den har en egen ämnesomsättning och styrs av egna arvsanlag. Finns olika typer av celler ex. djurcell, växtcell, bakteriecell och svampcell."]},{"term":"Flercellig organism","explanation":"En organism som består av flera celler.","required":[["organism"],["flera","många"],["celler","cell"]],"wrong":["Den minsta levande enheten. Den har en egen ämnesomsättning och styrs av egna arvsanlag. Finns olika typer av celler ex. djurcell, växtcell, bakteriecell och svampcell.","Finns i vissa celler och innehåller klorofyll."]},{"term":"Nedbrytare","explanation":"Lever på döda delar från växter och djur.","required":[["döda","dött"],["växter","djur"],["lever","delar"]],"wrong":["En organism som tar sin näring från andra levande varelser.","Är kemiska partiklar som är mindre än bakterier. Virus består inte av celler och är inte levande."]},{"term":"Parasit","explanation":"En organism som tar sin näring från andra levande varelser.","required":[["organism"],["näring"],["andra","värd"],["levande","varelser"]],"wrong":["Är kemiska partiklar som är mindre än bakterier. Virus består inte av celler och är inte levande.","Lever på döda delar från växter och djur."]},{"term":"Virus","explanation":"Är kemiska partiklar som är mindre än bakterier. Virus består inte av celler och är inte levande.","required":[["partiklar","partikel"],["mindre","bakterier"],["inte","saknar"],["celler","levande"]],"wrong":["Lever på döda delar från växter och djur.","En organism som tar sin näring från andra levande varelser."]},{"term":"Ryggradslösa djur","explanation":"Djur utan ryggrad och skelett. Ex. svampdjur, rundmaskar, ringmaskar och leddjur.","required":[["djur"],["utan","saknar"],["ryggrad"],["skelett"]],"wrong":["Djur med ryggrad och skelett. Till gruppen tillhör: fiskar, groddjur, kräldjur, däggdjur och fåglar.","Kroppstemperaturen följer omgivningens temperatur."]},{"term":"Ryggradsdjur","explanation":"Djur med ryggrad och skelett. Till gruppen tillhör: fiskar, groddjur, kräldjur, däggdjur och fåglar.","required":[["djur"],["ryggrad"],["skelett"]],"wrong":["Kroppstemperaturen följer omgivningens temperatur.","Fåglar och däggdjur är jämnvarma. De har en jämn kroppstemperatur som inte påverkas av omgivningen."]},{"term":"Växelvarma djur","explanation":"Kroppstemperaturen följer omgivningens temperatur.","required":[["kroppstemperatur","temperatur"],["följer","påverkas"],["omgivning"]],"wrong":["Fåglar och däggdjur är jämnvarma. De har en jämn kroppstemperatur som inte påverkas av omgivningen.","Spermier och äggceller smälter samman inuti honans kropp. Kräldjur, fåglar och däggdjur har inre befruktning."]},{"term":"Jämnvarma djur","explanation":"Fåglar och däggdjur är jämnvarma. De har en jämn kroppstemperatur som inte påverkas av omgivningen.","required":[["jämn","konstant"],["kroppstemperatur","temperatur"],["inte","opåverkad"],["omgivning"]],"wrong":["Spermier och äggceller smälter samman inuti honans kropp. Kräldjur, fåglar och däggdjur har inre befruktning.","Spermier och äggceller träffas utanför honans kropp. Fiskar och groddjur har yttre befruktning."]},{"term":"Inre befruktning","explanation":"Spermier och äggceller smälter samman inuti honans kropp. Kräldjur, fåglar och däggdjur har inre befruktning.","required":[["spermier"],["äggceller","ägg"],["inuti","inne i"],["honans","kropp"]],"wrong":["Spermier och äggceller träffas utanför honans kropp. Fiskar och groddjur har yttre befruktning.","Djur utan ryggrad och skelett. Ex. svampdjur, rundmaskar, ringmaskar och leddjur."]},{"term":"Yttre befruktning","explanation":"Spermier och äggceller träffas utanför honans kropp. Fiskar och groddjur har yttre befruktning.","required":[["spermier"],["äggceller","ägg"],["utanför"],["honans","kropp"]],"wrong":["Djur utan ryggrad och skelett. Ex. svampdjur, rundmaskar, ringmaskar och leddjur.","Djur med ryggrad och skelett. Till gruppen tillhör: fiskar, groddjur, kräldjur, däggdjur och fåglar."]},{"term":"Fotosyntes","explanation":"Växternas tillverkning av glukos och syre med hjälp av koldioxid, vatten och ljusenergi. Koldioxid + Vatten + Ljusenergi → Glukos + Syre.","required":[["växter","växternas"],["glukos"],["syre"],["koldioxid"],["vatten"],["ljusenergi","ljus"]],"wrong":["Cellernas förbränning av glukos med hjälp av syre. Glukos + Syre → Koldioxid + vatten och ljusenergi.","Växternas tillverkning av glukos och syre med hjälp av koldioxid, vatten och ljusenergi. Koldioxid + Vatten + Ljusenergi → Glukos + Syre."]},{"term":"Cellandning","explanation":"Cellernas förbränning av glukos med hjälp av syre. Glukos + Syre → Koldioxid + vatten och ljusenergi.","required":[["celler","cellernas"],["glukos"],["syre"],["koldioxid"],["vatten"],["energi","ljusenergi"]],"wrong":["Växternas tillverkning av glukos och syre med hjälp av koldioxid, vatten och ljusenergi. Koldioxid + Vatten + Ljusenergi → Glukos + Syre.","Cellernas förbränning av glukos med hjälp av syre. Glukos + Syre → Koldioxid + vatten och ljusenergi."]}];let qs=[],i=0,score=0,first=0,attempted=false,passed=false,selected=null,mode='write';const $=id=>document.getElementById(id);function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}function shuffle(a){for(let x=a.length-1;x;x--){const y=Math.floor(Math.random()*(x+1));[a[x],a[y]]=[a[y],a[x]]}return a}function setPeek(open){$('peek').classList.toggle('open',open);$('peekBtn').setAttribute('aria-expanded',String(open))}function hideFeedback(){$('feedback').className='feedback';$('next').classList.remove('show');document.querySelectorAll('.option').forEach(x=>x.classList.remove('correct-choice','wrong-choice'))}function assessWritten(text,q){const a=norm(text);if(a.length<3)return['bad','Skriv ett svar','Skriv en förklaring innan du bedömer.'];const missing=q.required.filter(group=>!group.some(word=>a.includes(norm(word))));if(!missing.length)return['good','Rätt!','Alla nödvändiga delar finns med.'];const matched=q.required.length-missing.length;return matched?['partial','Delvis korrekt',`Du har med ${matched} av ${q.required.length} nödvändiga delar.`]:['bad','Inte rätt','De nödvändiga delarna saknas.']}function renderOptions(q){selected=null;const answers=shuffle([q.explanation,...q.wrong]);$('options').innerHTML='<legend>Markera ett alternativ</legend>';answers.forEach(text=>{const label=document.createElement('label');label.className='option';label.innerHTML='<input type="radio" name="answerChoice"><span></span>';label.querySelector('span').textContent=text;label.querySelector('input').onchange=()=>{selected=text;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));label.classList.add('selected');hideFeedback()};$('options').appendChild(label)})}function render(){selected=null;attempted=passed=false;const q=qs[i];$('term').textContent=q.term;$('popup').textContent=q.explanation;$('counter').textContent=`Begrepp ${i+1} av ${qs.length}`;$('score').textContent=`${score} rätt`;$('bar').style.width=`${i/qs.length*100}%`;$('questionType').textContent=mode==='write'?'Skriv en förklaring':'Välj rätt förklaring';$('writeArea').classList.toggle('hidden',mode!=='write');$('options').classList.toggle('hidden',mode!=='choice');$('answer').value='';if(mode==='choice')renderOptions(q);setPeek(false);hideFeedback()}function markCorrect(){if(!passed){score++;passed=true;if(!attempted)first++;happy()}$('next').classList.add('show');$('score').textContent=`${score} rätt`}function check(){const q=qs[i];if(mode==='write'){const result=assessWritten($('answer').value,q);$('feedback').className=`feedback show ${result[0]}`;$('ft').textContent=result[1];$('fm').textContent=result[2];if(result[0]==='good')markCorrect();else attempted=true;return}if(selected===null){$('feedback').className='feedback show bad';$('ft').textContent='Välj ett svar';$('fm').textContent='Markera ett alternativ innan du bedömer.';return}const right=selected===q.explanation;document.querySelectorAll('.option').forEach(label=>{const text=label.querySelector('span').textContent;if(text===q.explanation)label.classList.add('correct-choice');else if(label.classList.contains('selected'))label.classList.add('wrong-choice')});if(right){$('feedback').className='feedback show good';$('ft').textContent='Rätt!';$('fm').textContent='Du valde rätt förklaring.';markCorrect()}else{$('feedback').className='feedback show bad';$('ft').textContent='Inte rätt';$('fm').textContent='Välj ett annat alternativ och försök igen.';attempted=true}}function clearAnswer(){$('answer').value='';selected=null;document.querySelectorAll('.option').forEach(label=>{label.className='option';const input=label.querySelector('input');if(input)input.checked=false});hideFeedback()}function happy(){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C();[523,659,784,1047].forEach((f,n)=>{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+n*.1;o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.16,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.23)});setTimeout(()=>c.close(),900)}function home(){qs=[];i=score=first=0;setPeek(false);$('quiz').classList.add('hidden');$('finish').classList.add('hidden');$('start').classList.remove('hidden')}function done(){const p=Math.round(first/qs.length*100),size=p>=80?'large':p>=50?'medium':'small';$('trophy').className=`trophy ${size}`;$('award').textContent=p>=80?'Guldpokal':p>=50?'Silverpokal':'Bronspokal';$('summary').textContent=`Rätt på första försöket: ${first} av ${qs.length} (${p} %).`;$('quiz').classList.add('hidden');$('finish').classList.remove('hidden')}
